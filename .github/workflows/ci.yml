name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Astro build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://marianapita.pt
      - name: Worker typecheck
        run: npm run worker:check
