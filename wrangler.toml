# Configuração do Cloudflare via Wrangler.
# O site é um build estático do Astro (dist/), servido pelo binding ASSETS.
# Um Worker (worker/index.ts) adiciona o funnel Skin Call e o dashboard admin:
#   - POST /api/lead        grava lead no D1 e envia email de notificação
#   - GET  /diagnostico     página privada pré-preenchida a partir do token
#   - GET  /admin           dashboard admin (protegido por auth)
#   - (tudo o resto)        serve os assets estáticos do Astro
name = "miana"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# Desativa o subdomínio público *.workers.dev - o site só fica nos domínios custom.
workers_dev = false

# Entry point do Worker que adiciona a API do funnel.
main = "worker/index.ts"

# Domínio custom - liga o worker a marianapita.pt.
routes = [
  { pattern = "marianapita.pt", custom_domain = true },
  { pattern = "www.marianapita.pt", custom_domain = true }
]

[assets]
binding = "ASSETS"
directory = "./dist"

# D1 database - leads, diagnostics, sessions, rate_limits.
[[d1_databases]]
binding = "DB"
database_name = "miana-db"
database_id = "96baa0e0-4f83-4b29-a3fd-676202d7c173"

# Bucket R2 para fotos do diagnóstico.
# As fotos ficam na pasta "diagnostics" dentro do bucket (definido em worker/constants.ts).
[[r2_buckets]]
binding = "DIAG_PHOTOS"
bucket_name = "media"

# Variáveis de ambiente.
# - EMAIL_ENABLED: enquanto a API do Resend não estiver operacional usamos stub (log em vez de enviar).
#   Em deploy real: npx wrangler secret put EMAIL_ENABLED
# - RESEND_API_KEY: chave de API do Resend (envio de email transacional, https://resend.com).
#   Em deploy real: npx wrangler secret put RESEND_API_KEY
# - OWNER_EMAIL: email da dona - recebe o pedido real do diagnóstico e os avisos leves.
# - SITE_URL: URL base do site (fallback: https://marianapita.pt)
# - FROM_EMAIL: email de origem para emails ao cliente (fallback: hello@marianapita.pt)
# - EMAIL_FORWARD_TO: caixa real para cópia inbound (opcional, se o Worker fizer forward)
# - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: OAuth Calendar (Meet)
# - FROM_NAME: nome de exibição do remetente (fallback: Mariana Pita Makeup)
# - ADMIN_URL: URL base da dashboard admin (fallback: ${SITE_URL}/admin)
[vars]
EMAIL_ENABLED = "true"
OWNER_EMAIL = "hello@marianapita.pt"
SITE_URL = "https://marianapita.pt"
FROM_EMAIL = "hello@marianapita.pt"
FROM_NAME = "Mariana Pita Makeup"