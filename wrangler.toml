# Configuração do Cloudflare Pages via Wrangler (nova versão, Pages on Workers).
# O site é um build estático do Astro (output: dist).
name = "miana"
compatibility_date = "2026-08-06"

[assets]
directory = "./dist"

# Domínio custom — liga o worker a marianapita.pt (ativa após a zona ficar Active no Cloudflare)
routes = [
  { pattern = "marianapita.pt", custom_domain = true },
  { pattern = "www.marianapita.pt", custom_domain = true }
]
